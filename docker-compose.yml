services:
  db:
    image: postgres:16-alpine
    container_name: pace-db
    environment:
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
      POSTGRES_DB: pace
    ports:
      - "5432:5432"
    volumes:
      - pace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pace-pgdata:
